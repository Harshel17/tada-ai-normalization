[project]
name = "tada-normalize"
version = "0.1.0"
description = "Normalizes PrismHR, isolved and UKG Ready payloads into one canonical model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
tada-normalize = "normalization.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a live PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Starter files supplied with the assignment keep their original formatting.
"src/normalization/references.py" = ["E501", "SIM", "B", "UP"]
"tests/test_reference_integrity.py" = ["E501", "SIM", "B", "UP", "I"]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501", "I", "UP"]
"scripts/*" = ["E501", "SIM", "UP", "I"]
