# Local development database only. Not hardened for any shared or public environment.
services:
  db:
    image: postgres:16-alpine
    container_name: tada-normalize-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tada_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tada_normalize}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432" # bound to localhost only
    volumes:
      - tada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tada_pgdata:
